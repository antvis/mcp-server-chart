name: MCP Assert

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - run: npm run build

      - uses: blackwell-systems/mcp-assert-action@v1
        with:
          suite: evals/
          timeout: 30s
